name: Validate Mission Survival

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check project files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
          node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest', 'utf8'))"
      - name: Verify required assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s favicon.svg
          test -s manifest.webmanifest
          test -s service-worker.js
          if grep -Fq '\n' index.html; then echo 'Unexpected literal \n sequence in index.html'; exit 1; fi
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'href="favicon.svg"' index.html
          grep -q 'href="manifest.webmanifest"' index.html
          grep -q 'id="taskList"' index.html
          grep -q 'id="scienceNote"' index.html
          grep -q 'DAY 03 · WATER & FOOD' app.js
          grep -q 'HIDDEN · PERFECT MARGIN' app.js
          grep -q 'NOVA · MISSION COMPANION' app.js
