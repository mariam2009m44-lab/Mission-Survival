name: Validate Mission Survival

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Check project files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Verify required assets
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s favicon.svg
          test -s manifest.webmanifest
          test -s service-worker.js
          grep -q 'href="styles.css"' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'href="favicon.svg"' index.html
          grep -q 'href="manifest.webmanifest"' index.html
