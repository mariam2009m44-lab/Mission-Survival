name: Validate Lunar Outpost
on:
  push:
    branches: [main, rebuild/mission-trainer-app]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node --check src/main.js
      - run: node --check src/scene3d.js
      - run: node --check src/nova.js
      - run: node --check src/engine.js
      - run: node -e "JSON.parse(require('node:fs').readFileSync('manifest.webmanifest','utf8'));JSON.parse(require('node:fs').readFileSync('data/mission-science.json','utf8'))"