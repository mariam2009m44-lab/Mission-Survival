<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-labelledby="title desc">
<title id="title">NOVA friendly lunar robot</title>
<desc id="desc">A friendly rounded white and turquoise lunar exploration robot with a glowing blue face and small antenna.</desc>
<defs>
 <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#b8d9ed"/></linearGradient>
 <linearGradient id="face" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#233d73"/><stop offset="1" stop-color="#101d42"/></linearGradient>
 <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8af2eb"/><stop offset="1" stop-color="#7b9cff"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="80" cy="82" r="72" fill="#7b9cff" opacity=".12"/>
<path d="M80 17v13" stroke="#8af2eb" stroke-width="6" stroke-linecap="round"/>
