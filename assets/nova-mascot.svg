<rect x="50" y="56" width="60" height="49" rx="17" fill="url(#face)" stroke="#91e8ec" stroke-width="3"/>
<ellipse cx="67" cy="79" rx="5" ry="7" fill="#8af2eb" filter="url(#glow)"/>
<ellipse cx="93" cy="79" rx="5" ry="7" fill="#8af2eb" filter="url(#glow)"/>
<path d="M70 91q10 9 20 0" fill="none" stroke="#ffd27a" stroke-width="3" stroke-linecap="round"/>
<path d="M57 116h46l9 15H48l9-15Z" fill="#78dce8" stroke="#8fb8d7" stroke-width="2"/>
